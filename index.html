
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>SD Food Import</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:22px;background:#141414;border-bottom:1px solid #c5a04c}
.crown{font-size:38px;color:#d9b65e}
.logo{font-size:25px;font-weight:bold;color:#d9b65e}
header p{font-size:11px;color:#aaa;letter-spacing:3px}
.search{padding:15px}
input{width:100%;padding:14px;border-radius:10px;background:#191919;border:1px solid #a88743;color:white;font-size:16px}
.categories{display:flex;gap:8px;overflow:auto;padding:0 15px 15px}
.categories button{white-space:nowrap;background:#191919;color:#d9b65e;border:1px solid #a88743;padding:10px 14px;border-radius:20px}
h2{color:#d9b65e;padding:0 15px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#171717;border:1px solid #554521;border-radius:13px;padding:11px;min-width:0}
.photo{height:110px;background:#222;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:45px}
.photo img{width:100%;height:100%;object-fit:contain}
.card h3{font-size:15px}
.price{color:#e1bd64;font-weight:bold;font-size:14px}
.wholesale{color:#aaa;font-size:12px;margin-top:7px}
.card button,.checkout{width:100%;padding:11px;margin-top:10px;background:linear-gradient(90deg,#a17b30,#e5c36e);border:0;border-radius:8px;color:#111;font-weight:bold}
.cart{position:fixed;bottom:0;left:0;right:0;background:#171717;border-top:1px solid #b99442;padding:13px;display:flex;justify-content:space-between;align-items:center}
.cart strong{color:#e1bd64}
main{padding-bottom:100px}
.empty{text-align:center;color:#aaa;padding:35px 15px;grid-column:1/-1}
#cartDetails{padding:15px}
</style>
</head>
<body>
<header>
<div class="crown">♛</div>
<div class="logo">SD FOOD IMPORT</div>
<p>PREMIUM QUALITY • BEST PRICE</p>
</header>

<div class="search">
<input id="search" placeholder="Mahsulot qidirish..." oninput="render()">
</div>

<div class="categories">
<button onclick="filter('Barchasi')">Barchasi</button>
<button onclick="filter('Ichimliklar')">Ichimliklar</button>
<button onclick="filter('Shirinliklar')">Shirinliklar</button>
<button onclick="filter('Oziq-ovqat')">Oziq-ovqat</button>
</div>

<main>
<h2>✦ Mahsulotlar katalogi</h2>
<div class="products" id="products"></div>
<h2>✦ Savatingiz</h2>
<div id="cartDetails"></div>
</main>

<div class="cart">
<div>🛒 Savat: <strong id="count">0</strong> ta</div>
<strong id="total">0 so‘m</strong>
</div>

<script>
let selected='Barchasi';
let cart=[];
let items=[];

function loadProducts(){
try{
items=JSON.parse(localStorage.getItem('sd_products')||'[]');
if(!Array.isArray(items))items=[];
}catch(e){items=[]}
render();
}

function filter(cat){
selected=cat;
render();
}

function money(n){
return Number(n||0).toLocaleString('uz-UZ')+' so‘m';
}

function render(){
const q=document.getElementById('search').value.toLowerCase();
const list=items.filter(x=>{
const name=String(x.name||'').toLowerCase();
const category=String(x.cat||'Barchasi');
return (selected==='Barchasi'||category===selected)&&name.includes(q);
});

document.getElementById('products').innerHTML=list.map(x=>{
const i=items.indexOf(x);
const photo=x.image
?'<img src="'+escapeHTML(x.image)+'" alt="">'
:'📦';
return `<div class="card">
<div class="photo">${photo}</div>
<h3>${escapeHTML(x.name)}</h3>
<div class="price">Oddiy: ${money(x.price)}</div>
<div class="wholesale">Ulgurji: ${money(x.wholesale)}</div>
<button onclick="add(${i})">Savatga qo‘shish</button>
</div>`;
}).join('')||'<div class="empty">Hozircha mahsulot yo‘q. Admin paneldan mahsulot qo‘shing.</div>';
}

function add(i){
if(!items[i])return;
cart.push(items[i]);
updateCart();
}

function updateCart(){
document.getElementById('count').innerText=cart.length;
document.getElementById('total').innerText=money(cart.reduce((s,x)=>s+Number(x.price||0),0));

document.getElementById('cartDetails').innerHTML=cart.length
?cart.map((x,i)=>`<div style="padding:10px;border-bottom:1px solid #554521">
${escapeHTML(x.name)} — ${money(x.price)}
<button onclick="removeCart(${i})" style="float:right">✕</button>
</div>`).join('')
:'<p style="color:#aaa">Savatingiz hozircha bo‘sh.</p>';
}

function removeCart(i){
cart.splice(i,1);
updateCart();
}

function escapeHTML(s){
return String(s||'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}

window.addEventListener('storage',e=>{
if(e.key==='sd_products')loadProducts();
});
window.addEventListener('focus',loadProducts);

loadProducts();
updateCart();
</script>
</body>
</html>
